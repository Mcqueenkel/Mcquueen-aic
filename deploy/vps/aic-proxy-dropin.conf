# Drop-in for aic.service: send the farm's HTTPS through aic-proxy.service.
# Installed as /etc/systemd/system/aic.service.d/proxy.conf by scripts/proxy_setup.sh.
[Unit]
Wants=aic-proxy.service
After=aic-proxy.service

[Service]
Environment=https_proxy=http://127.0.0.1:8899
Environment=no_proxy=localhost,127.0.0.1
